<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Hub View</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; }
        #main-frame { width:100%; height:100%; border:none; display:block; }
        .error-screen { width:100%; height:100%; display:flex; justify-content:center; align-items:center; color:#ff00ea; text-align:center; background:#05050a; }
        .hidden { display:none !important; }

        /* Offline Popup CSS */
        #offline-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .offline-box {
            background: #111; border: 2px solid #ff0000; 
            padding: 30px; border-radius: 10px; text-align: center; color: white;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); width: 80%; max-width: 350px;
        }
        .offline-box h2 { margin: 0 0 10px 0; color: #ff0000; font-size: 22px; }
        .offline-box p { margin: 0; color: #ccc; font-size: 14px; }
    </style>
</head>
<body>
    <!-- Offline Internet Popup -->
    <div id="offline-popup" class="hidden">
        <div class="offline-box">
            <h2>No Internet</h2>
            <p>Please check your connection.</p>
        </div>
    </div>

    <!-- Maintenance UI -->
    <div id="stop-ui" class="error-screen hidden">
        <div>
            <h1>SYSTEM OFFLINE</h1>
            <p>Maintenance in progress...</p>
        </div>
    </div>
    
    <!-- Main Content -->
    <iframe id="main-frame" src="about:blank"></iframe>

    <script>
        // Internet Connection Detector
        const offlinePopup = document.getElementById('offline-popup');
        function checkConnection() {
            if (!navigator.onLine) {
                offlinePopup.classList.remove('hidden');
            } else {
                offlinePopup.classList.add('hidden');
            }
        }
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);
        checkConnection(); // initial check

        // Firebase Setup
        const APP_KEY = "-OnwDhZ1muxqhIJ5Lm69";
        const config = { databaseURL: "https://free-fire-tornament-64fa8-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        const frame = document.getElementById('main-frame');
        const stopUi = document.getElementById('stop-ui');
        let currentMode = ""; 
        let currentUrl = "";

        db.ref('apps/'+APP_KEY+'/appState').on('value', s => {
            const d = s.val() || {};
            
            // Check Maintenance
            if(d.isStopped) {
                stopUi.classList.remove('hidden');
                frame.classList.add('hidden');
                currentMode = "stopped";
                return;
            }
            
            stopUi.classList.add('hidden');
            frame.classList.remove('hidden');

            // Mode Switch (URL vs HTML)
            if(d.showWebsite) {
                if(currentUrl !== d.websiteUrl || currentMode !== "web") {
                    currentUrl = d.websiteUrl;
                    currentMode = "web";
                    frame.src = d.websiteUrl;
                }
            } else {
                if(currentMode !== "html" || frame.dataset.content !== d.htmlContent) {
                    currentMode = "html";
                    currentUrl = "";
                    frame.dataset.content = d.htmlContent;
                    const doc = frame.contentWindow.document;
                    doc.open();
                    doc.write(d.htmlContent || "<body></body>");
                    doc.close();
                }
            }
        });
    </script>
</body>
</html>
